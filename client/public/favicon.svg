    <!-- North America -->
    <path d="M10 14 C12 12 15 11 18 12 C20 13 22 15 21 18 C20 21 18 24 16 26 C14 28 12 30 11 28 C9 25 9 20 9 17 Z" fill="#4ade80"/>
    <!-- South America -->
    <path d="M14 32 C16 31 18 32 19 34 C20 37 19 40 18 43 C17 46 15 48 13 47 C11 45 10 41 11 38 C11 35 12 33 14 32 Z" fill="#4ade80"/>
    <!-- Europe -->
    <path d="M28 13 C30 12 33 12 35 13 C36 14 36 16 35 17 C34 18 31 18 29 17 C27 16 27 14 28 13 Z" fill="#4ade80"/>
    <!-- Africa -->
    <path d="M28 20 C30 19 33 19 35 21 C37 23 37 27 36 31 C35 35 33 38 30 38 C27 37 26 34 26 30 C26 26 27 22 28 20 Z" fill="#4ade80"/>
    <!-- Asia -->
    <path d="M37 11 C40 10 44 11 48 13 C51 15 53 18 53 22 C53 25 51 27 48 28 C45 29 41 28 39 26 C37 24 36 20 36 17 C36 14 37 12 37 11 Z" fill="#4ade80"/>
    <!-- Australia -->
    <path d="M44 36 C47 35 50 36 52 38 C53 40 53 43 51 44 C49 45 46 45 44 43 C42 41 42 38 44 36 Z" fill="#4ade80"/>
  </g>
  <!-- Map fold lines -->
  <line x1="24" y1="8" x2="24" y2="52" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
  <line x1="40" y1="12" x2="40" y2="56" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
  <!-- Route line -->
  <polyline points="14,44 20,36 28,38 34,28 42,24 50,18" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Route points -->
  <circle cx="14" cy="44" r="3" fill="#22c55e" stroke="#fff" stroke-width="1"/>
  <circle cx="28" cy="38" r="2.5" fill="#6366f1" stroke="#fff" stroke-width="0.8"/>
  <circle cx="42" cy="24" r="2.5" fill="#8b5cf6" stroke="#fff" stroke-width="0.8"/>
  <circle cx="50" cy="18" r="3" fill="#ef4444" stroke="#fff" stroke-width="1"/>
</svg>
